name: sharegif
description: "Convierte tus GIFs y videos en stickers animados, desde tu teléfono."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  ffmpeg_kit_flutter_new_video: ^2.6.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
